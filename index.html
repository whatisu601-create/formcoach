<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>FormCoach</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, sans-serif; }
  #video, #canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #canvas { z-index: 2; }
  #video { z-index: 1; transform: scaleX(-1); }
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    z-index: 3; padding: 20px; color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
  }
  #reps { font-size: 64px; font-weight: 800; line-height: 1; }
  #reps-label { font-size: 14px; opacity: 0.7; letter-spacing: 2px; text-transform: uppercase; }
  #right { text-align: right; }
  #status { font-size: 13px; opacity: 0.8; }
  #angle { font-size: 28px; font-weight: 700; margin-top: 4px; }
  #state { font-size: 20px; font-weight: 800; margin-top: 4px; letter-spacing: 1px; }
  #state.up { color: #22c55e; }
  #state.down { color: #f59e0b; }
  #startBtn {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    z-index: 4; padding: 16px 40px; border-radius: 100px;
    background: #22c55e; color: #000; font-size: 18px; font-weight: 700;
    border: none; box-shadow: 0 8px 24px rgba(34,197,94,0.5);
  }
</style>
</head>
<body>
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div>
      <div id="reps-label">Reps</div>
      <div id="reps">0</div>
    </div>
    <div id="right">
      <div id="status">Tap Start</div>
      <div id="angle">--°</div>
      <div id="state">--</div>
    </div>
  </div>

  <button id="startBtn">Start</button>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.20.0/dist/tf-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.20.0/dist/tf-converter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.20.0/dist/tf-backend-webgl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const repsEl = document.getElementById('reps');
const statusEl = document.getElementById('status');
const angleEl = document.getElementById('angle');
const stateEl = document.getElementById('state');
const startBtn = document.getElementById('startBtn');

let detector = null;
let running = false;

// Squat state
let reps = 0;
let phase = 'up';          // 'up' or 'down'
const UP_ANGLE = 160;      // above this = standing
const DOWN_ANGLE = 100;    // below this = bottom of squat

const CONNECTIONS = [
  [0,1],[0,2],[1,3],[2,4],
  [5,6],[5,7],[7,9],[6,8],[8,10],
  [5,11],[6,12],[11,12],
  [11,13],[13,15],[12,14],[14,16]
];

// MoveNet keypoint indices
const L_HIP = 11, L_KNEE = 13, L_ANKLE = 15;
const R_HIP = 12, R_KNEE = 14, R_ANKLE = 16;

function setStatus(msg) { statusEl.textContent = msg; }

function angle(a, b, c) {
  // Angle at point b, between a-b and c-b
  const ab = { x: a.x - b.x, y: a.y - b.y };
  const cb = { x: c.x - b.x, y: c.y - b.y };
  const dot = ab.x * cb.x + ab.y * cb.y;
  const magA = Math.hypot(ab.x, ab.y);
  const magC = Math.hypot(cb.x, cb.y);
  if (magA === 0 || magC === 0) return null;
  const cos = Math.max(-1, Math.min(1, dot / (magA * magC)));
  return Math.acos(cos) * (180 / Math.PI);
}

function resizeCanvas() {
  canvas.width = video.videoWidth || window.innerWidth;
  canvas.height = video.videoHeight || window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
    audio: false
  });
  video.srcObject = stream;
  await video.play();
  resizeCanvas();
}

async function loadModel() {
  setStatus('Loading model...');
  await tf.setBackend('webgl');
  await tf.ready();
  detector = await poseDetection.createDetector(
    poseDetection.SupportedModels.MoveNet,
    { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING }
  );
  setStatus('Ready');
}

function toCanvasCoords(keypoints) {
  const w = canvas.width;
  const h = canvas.height;
  const vw = video.videoWidth || w;
  const vh = video.videoHeight || h;
  return keypoints.map(p => ({
    x: w - p.x * (w / vw),
    y: p.y * (h / vh),
    score: p.score
  }));
}

function drawSkeleton(kp) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Bones
  ctx.strokeStyle = '#22c55e';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  for (const [a, b] of CONNECTIONS) {
    if (kp[a].score > 0.3 && kp[b].score > 0.3) {
      ctx.beginPath();
      ctx.moveTo(kp[a].x, kp[a].y);
      ctx.lineTo(kp[b].x, kp[b].y);
      ctx.stroke();
    }
  }

  // Joints
  ctx.fillStyle = '#fff';
  for (const p of kp) {
    if (p.score > 0.3) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function updateSquatLogic(rawKp) {
  const lh = rawKp[L_HIP], lk = rawKp[L_KNEE], la = rawKp[L_ANKLE];
  const rh = rawKp[R_HIP], rk = rawKp[R_KNEE], ra = rawKp[R_ANKLE];

  const leftOk = lh.score > 0.3 && lk.score > 0.3 && la.score > 0.3;
  const rightOk = rh.score > 0.3 && rk.score > 0.3 && ra.score > 0.3;

  let kneeAngle = null;
  if (leftOk && rightOk) {
    const l = angle(lh, lk, la);
    const r = angle(rh, rk, ra);
    kneeAngle = (l + r) / 2;
  } else if (leftOk) {
    kneeAngle = angle(lh, lk, la);
  } else if (rightOk) {
    kneeAngle = angle(rh, rk, ra);
  }

  if (kneeAngle === null) {
    angleEl.textContent = '--°';
    stateEl.textContent = '--';
    stateEl.className = '';
    return;
  }

  angleEl.textContent = Math.round(kneeAngle) + '°';

  if (kneeAngle > UP_ANGLE) {
    // At the top
    if (phase === 'down') {
      reps++;
      repsEl.textContent = reps;
    }
    phase = 'up';
    stateEl.textContent = 'UP';
    stateEl.className = 'up';
  } else if (kneeAngle < DOWN_ANGLE) {
    phase = 'down';
    stateEl.textContent = 'DOWN';
    stateEl.className = 'down';
  }
}

async function loop() {
  if (!running) return;
  if (video.readyState >= 2 && detector) {
    const poses = await detector.estimatePoses(video, { flipHorizontal: false });
    if (poses.length > 0) {
      const raw = poses[0].keypoints;
      const kp = toCanvasCoords(raw);
      drawSkeleton(kp);
      updateSquatLogic(raw);
      if (statusEl.textContent !== 'Tracking') setStatus('Tracking');
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      setStatus('No person detected');
    }
  }
  requestAnimationFrame(loop);
}

startBtn.addEventListener('click', async () => {
  startBtn.style.display = 'none';
  try {
    await startCamera();
    await loadModel();
    running = true;
    loop();
  } catch (err) {
    setStatus('Error: ' + err.message);
    console.error(err);
  }
});
</script>
</body>
</html>
