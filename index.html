<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>FormCoach</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, sans-serif; }
  #video, #canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #canvas { z-index: 2; }
  #video { z-index: 1; transform: scaleX(-1); }
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    z-index: 3; padding: 20px; color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
  }
  #reps { font-size: 56px; font-weight: 800; line-height: 1; }
  #reps-label { font-size: 14px; opacity: 0.7; letter-spacing: 2px; text-transform: uppercase; }
  #status { font-size: 13px; opacity: 0.8; text-align: right; max-width: 40%; }
  #startBtn {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    z-index: 4; padding: 16px 40px; border-radius: 100px;
    background: #22c55e; color: #000; font-size: 18px; font-weight: 700;
    border: none; box-shadow: 0 8px 24px rgba(34,197,94,0.5);
  }
  #startBtn:active { transform: translateX(-50%) scale(0.96); }
</style>
</head>
<body>
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div>
      <div id="reps-label">Reps</div>
      <div id="reps">0</div>
    </div>
    <div id="status">Tap Start to load model</div>
  </div>

  <button id="startBtn">Start</button>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.20.0/dist/tf-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.20.0/dist/tf-converter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.20.0/dist/tf-backend-webgl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const repsEl = document.getElementById('reps');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');

let detector = null;
let running = false;

// Skeleton connections for MoveNet (17 keypoints)
const CONNECTIONS = [
  [0,1],[0,2],[1,3],[2,4],
  [5,6],[5,7],[7,9],[6,8],[8,10],
  [5,11],[6,12],[11,12],
  [11,13],[13,15],[12,14],[14,16]
];

function setStatus(msg) { statusEl.textContent = msg; }

function resizeCanvas() {
  canvas.width = video.videoWidth || window.innerWidth;
  canvas.height = video.videoHeight || window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
    audio: false
  });
  video.srcObject = stream;
  await video.play();
  resizeCanvas();
}

async function loadModel() {
  setStatus('Loading model...');
  await tf.setBackend('webgl');
  await tf.ready();
  detector = await poseDetection.createDetector(
    poseDetection.SupportedModels.MoveNet,
    { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING }
  );
  setStatus('Model ready');
}

function drawSkeleton(keypoints) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Mirror to match the flipped video
  const w = canvas.width;
  const kp = keypoints.map(p => ({
    x: w - p.x * (w / (video.videoWidth || w)),
    y: p.y * (canvas.height / (video.videoHeight || canvas.height)),
    score: p.score
  }));

  // Draw bones
  ctx.strokeStyle = '#22c55e';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  for (const [a, b] of CONNECTIONS) {
    if (kp[a].score > 0.3 && kp[b].score > 0.3) {
      ctx.beginPath();
      ctx.moveTo(kp[a].x, kp[a].y);
      ctx.lineTo(kp[b].x, kp[b].y);
      ctx.stroke();
    }
  }

  // Draw joints
  ctx.fillStyle = '#fff';
  for (const p of kp) {
    if (p.score > 0.3) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

async function loop() {
  if (!running) return;
  if (video.readyState >= 2 && detector) {
    const poses = await detector.estimatePoses(video, { flipHorizontal: false });
    if (poses.length > 0) {
      drawSkeleton(poses[0].keypoints);
      setStatus('Tracking');
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      setStatus('No person detected');
    }
  }
  requestAnimationFrame(loop);
}

startBtn.addEventListener('click', async () => {
  startBtn.style.display = 'none';
  try {
    await startCamera();
    await loadModel();
    running = true;
    loop();
  } catch (err) {
    setStatus('Error: ' + err.message);
    console.error(err);
  }
});
</script>
</body>
</html>
