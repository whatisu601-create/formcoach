<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Test</title>
</head>
<body style="background:#000;color:#fff;font-family:sans-serif;padding:20px;">
  <h1>Camera Test</h1>
  <p id="status">Tap the button</p>
  <button id="btn" style="font-size:20px;padding:20px 40px;background:#22c55e;border:none;border-radius:10px;font-weight:bold;">START CAMERA</button>
  <video id="video" playsinline autoplay muted style="width:100%;margin-top:20px;border-radius:10px;"></video>

<script>
document.getElementById('btn').addEventListener('click', async function() {
  document.getElementById('status').textContent = 'Button clicked. Asking camera...';
  try {
    var stream = await navigator.mediaDevices.getUserMedia({ video: true });
    document.getElementById('video').srcObject = stream;
    document.getElementById('status').textContent = 'Camera is ON';
  } catch (err) {
    document.getElementById('status').textContent = 'ERROR: ' + err.message;
  }
});
</script>
</body>
</html>
